[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stickforstats-jupyter"
version = "0.1.0"
description = "Jupyter extension for StickForStats — statistical analysis with Guardian protection"
requires-python = ">=3.8"
dependencies = ["stickforstats>=0.1.0", "ipython>=7.0", "ipywidgets>=7.0"]

[project.optional-dependencies]
lab = ["jupyterlab>=3.0"]
