[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stickforstats"
version = "0.4.0"
description = "Python SDK and CLI (sfs) for StickForStats — statistical analysis with automatic assumption validation (Guardian) and manuscript statistical verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "StickForStats Team" },
]
keywords = ["statistics", "analysis", "research", "guardian", "hypothesis-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
    "rich>=13.0",
]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.21",
    "ruff>=0.1",
]

[project.scripts]
sfs = "stickforstats.cli:main"

[project.urls]
Homepage = "https://github.com/visvikbharti/stickforstats_new"
Documentation = "https://github.com/visvikbharti/stickforstats_new/blob/main/docs/CLI_QUICKSTART.md"
Repository = "https://github.com/visvikbharti/stickforstats_new"
Issues = "https://github.com/visvikbharti/stickforstats_new/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stickforstats"]
# Ship the PEP 561 typing marker (the "Typing :: Typed" classifier promises it).
artifacts = ["src/stickforstats/py.typed"]

[tool.ruff]
target-version = "py38"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
