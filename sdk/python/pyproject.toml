[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stickforstats"
version = "0.1.0"
description = "Python SDK for StickForStats — the world's statistical analysis platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "StickForStats Team" },
]
keywords = ["statistics", "analysis", "research", "guardian", "hypothesis-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
    "rich>=13.0",
]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.21",
    "ruff>=0.1",
]

[project.scripts]
sfs = "stickforstats.cli:main"

[project.urls]
Homepage = "https://stickforstats.com"
Documentation = "https://docs.stickforstats.com"
Repository = "https://github.com/stickforstats/stickforstats-python"
Issues = "https://github.com/stickforstats/stickforstats-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stickforstats"]

[tool.ruff]
target-version = "py38"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
