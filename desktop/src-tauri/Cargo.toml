[package]
name = "stickforstats-desktop"
version = "2.0.0"
description = "StickForStats Desktop — Statistical Analysis Platform"
authors = ["StickForStats Team"]
license = "MIT"
repository = "https://github.com/stickforstats/desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
    "shell-open",
    "dialog-all",
    "fs-read-file",
    "fs-write-file",
    "fs-read-dir",
    "clipboard-all",
    "http-all",
    "notification-all",
    "window-close",
    "window-hide",
    "window-show",
    "window-maximize",
    "window-minimize",
    "window-unmaximize",
    "window-set-title",
    "window-set-size",
    "window-set-min-size",
    "window-set-position",
    "window-center",
    "updater",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
