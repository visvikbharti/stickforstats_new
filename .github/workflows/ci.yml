name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'paper/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'paper/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint (parallel, required) ──────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-pinned.txt

      - name: Install lint tools
        run: pip install flake8==6.1.0 black==23.11.0

      - name: Flake8
        run: flake8 . --count --statistics

      - name: Black (check only)
        run: black --check --diff . || true

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # `eslint src/` expands a DIRECTORY to .js only (plus overrides[].files globs,
      # and react-app's only such glob is **/*.ts?(x)). It therefore linted 293 files
      # and ZERO of the repo's 469 .jsx files, reported 0/0, and exited 0 — so
      # `--max-warnings 0` passed vacuously while no-use-before-define errors sat
      # uncaught in .jsx. That rule flags the temporal-dead-zone crashes that took
      # down the chi-square screen, ML train and CI plot.
      #
      # --ext makes it look at all 764 files. --max-warnings is a RATCHET: it is the
      # current count, so the gate cannot get worse; lower it as warnings are burned
      # down. Errors always fail, and no-use-before-define is now an error.
      - name: ESLint
        run: npm run lint
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  sdk-lint:
    name: SDK Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python SDK
        run: ruff check sdk/python/

  # ── Stage 2: Test (required) ───────────────────────────────────────
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: stickforstats.settings
      DJANGO_DEBUG: "True"
      CELERY_TASK_ALWAYS_EAGER: "True"
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        run: python manage.py test --verbosity 2

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npx react-scripts test --watchAll=false --passWithNoTests --ci

  sdk-test:
    name: SDK Test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python SDK
        run: pip install -e "sdk/python[dev]"

      - name: Run Python SDK tests
        run: pytest sdk/python/ --tb=short -q || echo "SDK tests require a live backend — skipped"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [backend-test, frontend-test]
    env:
      DJANGO_DEBUG: "True"
      CELERY_TASK_ALWAYS_EAGER: "True"
      NODE_OPTIONS: "--max-old-space-size=4096"
      PLAYWRIGHT_BASE_URL: "http://localhost:3000"
      PLAYWRIGHT_BACKEND_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        run: pip install -r backend/requirements.txt || pip install django djangorestframework django-cors-headers scipy numpy mpmath pandas

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install e2e deps
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        # CI=false so react-scripts does not treat pre-existing ESLint
        # warnings as errors (GitHub sets CI=true by default). This matches
        # the production Docker build, where CI is unset inside the build
        # context, so the E2E build behaves the same as the shipped image.
        run: CI=false npm run build

      - name: Start backend
        working-directory: backend
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          echo $! > /tmp/backend.pid
          # Wait up to 60 s for the server to respond.
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/api/v1/health/ >/dev/null 2>&1; then
              echo "Backend up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Start frontend (static build via npx serve)
        working-directory: frontend
        run: |
          npx --yes serve -s build -l 3000 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/ >/dev/null 2>&1; then
              echo "Frontend up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          kill $(cat /tmp/backend.pid) 2>/dev/null || true
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true

  # ── Stage 3: Docker build (main only) ──────────────────────────────
  docker-build:
    name: Docker Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Lint is in this list on purpose. It used to sit outside the chain, so a red
    # lint could not stop an image push — which made it decorative. It gates now
    # that frontend lint actually looks at .jsx and reports 0 errors.
    needs: [backend-test, frontend-test, backend-lint, frontend-lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            image: stickforstats-backend
          - context: frontend
            image: stickforstats-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 4: Push to GHCR (main only) ─────────────────────────────
  docker-push:
    name: Push to GHCR
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api
            REACT_APP_WS_URL=wss://stickforstats.com/ws
            REACT_APP_ENVIRONMENT=production
            REACT_APP_VERSION=1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 5: Deploy to staging (manual gate) ──────────────────────
  staging-deploy:
    name: Deploy to Staging
    needs: [docker-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy placeholder
        run: |
          echo "Deploy to staging would happen here"
          echo "Image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
          echo "Image: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
